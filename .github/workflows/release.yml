name: release-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName to stamp into the APK'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  check:
    name: unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintRelease --stacktrace

      # Reports only matter when something failed, and the account's artifact storage is
      # shared and small: a full quota must not fail a green build or block the release.
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  release-apk:
    name: signed release APK
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            NAME="${{ inputs.version_name }}"
          else
            NAME="1.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Materialise the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PADLAS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/padlas.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          else
            # No secret configured: still ship a signed APK, but with a throwaway key.
            # Installs from different runs will not upgrade each other - see README.
            echo "::warning::PADLAS_KEYSTORE_BASE64 is not set, signing with an ephemeral key."
            keytool -genkeypair -v -keystore "$KS" -storetype PKCS12 \
              -alias padlas -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass ephemeral -keypass ephemeral \
              -dname "CN=Padlas Ephemeral, OU=CI, O=Padlas, C=HU"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        env:
          PADLAS_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          PADLAS_KEYSTORE_PASSWORD: ${{ secrets.PADLAS_KEYSTORE_PASSWORD || 'ephemeral' }}
          PADLAS_KEY_ALIAS: ${{ secrets.PADLAS_KEY_ALIAS || 'padlas' }}
          PADLAS_KEY_PASSWORD: ${{ secrets.PADLAS_KEY_PASSWORD || 'ephemeral' }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Ppadlas.versionName=${{ steps.version.outputs.name }} \
            -Ppadlas.versionCode=${{ steps.version.outputs.code }}

      - name: Verify the APK is really signed
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --min-sdk-version 34 "$APK"

      - name: Rename artifact
        run: |
          set -euo pipefail
          OUT="padlas-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # The GitHub release below is where the APK lives; this copy is a convenience for
      # branch builds and must not stop a tag from being published when storage is full.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: padlas-release-apk
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          retention-days: 7

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256
          body: |
            Padlás ${{ steps.version.outputs.name }}

            Sideload build. Signed with ${{ steps.keystore.outputs.ephemeral == 'true' && 'an ephemeral CI key (set PADLAS_KEYSTORE_BASE64 for a stable one)' || 'the release key' }}.
          generate_release_notes: true
